[project]
name = "mcp-tools-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.2.0",
    "neo4j>=5.0.0",
    "redis[hiredis]>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mcp-base",
    "mcp-mysql",
    "mcp-neo4j",
    "mcp-redis",
]

[tool.uv.sources]
mcp-base = { path = "../libs/mcp-base" }
mcp-mysql = { path = "../packages/mcp-mysql" }
mcp-neo4j = { path = "../packages/mcp-neo4j" }
mcp-redis = { path = "../packages/mcp-redis" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
