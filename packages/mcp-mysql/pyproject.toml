[project]
name = "mcp-mysql"
version = "0.1.0"
description = "MySQL 数据库操作 MCP 服务器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp-base",
    "aiomysql>=0.2.0",
]

[project.scripts]
mcp-mysql = "mcp_mysql.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mysql"]

[tool.uv.sources]
mcp-base = { workspace = true }
