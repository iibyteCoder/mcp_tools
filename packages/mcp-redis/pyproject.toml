[project]
name = "mcp-redis"
version = "0.1.0"
description = "Redis 数据库操作 MCP 服务器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp-base",
    "redis[hiredis]>=5.0.0",
]

[project.scripts]
mcp-redis = "mcp_redis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_redis"]

[tool.uv.sources]
mcp-base = { workspace = true }
