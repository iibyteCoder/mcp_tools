[project]
name = "db-redis-cli"
version = "0.1.0"
description = "Agent-friendly Redis command line client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "db-cli-core",
    "mcp-redis",
]

[project.scripts]
db-redis = "redis_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redis_cli"]

[tool.hatch.build.targets.wheel.force-include]
"../../skills/redis-cli" = "redis_cli/skill"

[tool.uv.sources]
db-cli-core = { workspace = true }
mcp-redis = { workspace = true }
