[project]
name = "redis-cli"
version = "0.1.0"
description = "JSON-first Redis command line tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7,<9.0",
    "filelock>=3.16.0",
    "keyring>=25.6.0",
    "platformdirs>=4.3.0",
    "redis[hiredis]>=5.0.0,<7.0",
]

[project.scripts]
db-redis = "redis_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redis_cli"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
