[project]
name = "db-mysql-cli"
version = "0.1.0"
description = "Agent-friendly MySQL command line client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "db-cli-core",
    "mcp-mysql",
]

[project.scripts]
db-mysql = "mysql_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_cli"]

[tool.hatch.build.targets.wheel.force-include]
"../../skills/mysql-cli" = "mysql_cli/skill"

[tool.uv.sources]
db-cli-core = { workspace = true }
mcp-mysql = { workspace = true }
