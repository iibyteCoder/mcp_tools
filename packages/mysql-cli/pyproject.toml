[project]
name = "mysql-cli"
version = "0.1.0"
description = "JSON-only MySQL command line foundation"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7,<9.0",
    "mysql-client",
    "filelock>=3.16.0",
    "keyring>=25.6.0",
    "platformdirs>=4.3.0",
]

[project.scripts]
db-mysql = "mysql_cli.presentation.click.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_cli"]

[tool.uv.sources]
mysql-client = { workspace = true }

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
