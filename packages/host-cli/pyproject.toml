[project]
name = "host-cli"
version = "0.1.0"
description = "Send one command to a configured SSH host and report exactly what came back"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7,<9.0",
    "db-cli-kit",
    "platformdirs>=4.3.0",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
host-cli = "host_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/host_cli"]

[tool.uv.sources]
db-cli-kit = { workspace = true }

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: exercises a real SSH host and is skipped by default"]
