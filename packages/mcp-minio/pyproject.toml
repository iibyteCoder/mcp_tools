[project]
name = "mcp-minio"
version = "0.1.0"
description = "MinIO 对象存储操作 MCP 服务器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp-base",
    "minio>=7.2.0",
]

[project.scripts]
mcp-minio = "mcp_minio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_minio"]

[tool.uv.sources]
mcp-base = { workspace = true }
