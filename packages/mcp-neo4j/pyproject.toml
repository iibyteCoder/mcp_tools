[project]
name = "mcp-neo4j"
version = "0.1.0"
description = "Neo4j 图数据库操作 MCP 服务器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp-base",
    "neo4j>=5.0.0",
]

[project.scripts]
mcp-neo4j = "mcp_neo4j.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_neo4j"]

[tool.uv.sources]
mcp-base = { workspace = true }
