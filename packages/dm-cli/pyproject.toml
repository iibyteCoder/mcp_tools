[project]
name = "dm-cli"
version = "0.1.0"
description = "JSON-only Dameng DM8 command line tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7,<9.0",
    "db-cli-kit",
    "dm-client",
    "platformdirs>=4.3.0",
]

[project.scripts]
db-dm = "dm_cli.presentation.click.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dm_cli"]

[tool.uv.sources]
db-cli-kit = { workspace = true }
dm-client = { workspace = true }

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["dm_cli.presentation.click.types"]
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
