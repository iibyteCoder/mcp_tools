[project]
name = "mcp-tools"
version = "0.0.0"
description = "MCP 工具集 - MCP 服务器集合"
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["libs/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Ruff - 代码格式化 + Lint + 导入排序
# https://docs.astral.sh/ruff/
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "packages/*/src", "libs/*/src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_base", "mcp_minio", "mcp_mysql", "mcp_neo4j", "mcp_redis"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# MyPy 类型检查
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mcp.*", "aiomysql", "minio", "neo4j", "pydantic_settings", "redis"]
ignore_missing_imports = true
