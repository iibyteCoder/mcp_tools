[project]
name = "mysql-cli-workspace"
version = "0.0.0"
description = "MySQL CLI workspace"
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["libs/mysql-client", "packages/mysql-cli", "packages/redis-cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Ruff - 代码格式化 + Lint + 导入排序
# https://docs.astral.sh/ruff/
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "packages/*/src", "libs/*/src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mysql_client", "mysql_cli"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# MyPy 类型检查
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = ["e2e: tests that exercise the CLI against a real Redis service"]

[[tool.mypy.overrides]]
module = ["aiomysql"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mysql_cli.presentation.click.types"]
disable_error_code = ["type-arg"]
