[project]
name = "db-cli-core"
version = "0.1.0"
description = "Shared command framework for database CLIs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "filelock>=3.16.0",
    "keyring>=25.6.0",
    "mcp-base",
    "platformdirs>=4.3.0",
    "prompt-toolkit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_cli_core"]

[tool.uv.sources]
mcp-base = { workspace = true }
