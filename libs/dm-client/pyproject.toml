[project]
name = "dm-client"
version = "0.1.0"
description = "Typed domain foundation for Dameng DM8 execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dmPython>=2.6.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dm_client"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
