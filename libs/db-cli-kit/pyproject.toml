[project]
name = "db-cli-kit"
version = "0.1.0"
description = "Shared JSON, atomic persistence and profile primitives for db-* CLIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.16.0",
    "keyring>=25.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_cli_kit"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
