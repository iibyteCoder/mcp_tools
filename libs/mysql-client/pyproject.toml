[project]
name = "mysql-client"
version = "0.1.0"
description = "Typed asynchronous domain foundation for MySQL execution"
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.2.0",
    "sqlglot>=27.0.0,<28.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_client"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
